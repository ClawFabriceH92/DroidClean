# Workflow GitHub Actions Android — vérifications + build APK + release automatique
# - push / pull request sur n'importe quelle branche → contrôles + build (APK en artefact)
# - push sur main                                    → release flottante "latest"
# - tag v*                                           → release versionnée, version dérivée du tag
# - workflow_dispatch                                → build manuel
#
# Signature stable : keystore release stocké en secrets GitHub (DROIDCLEAN_KEYSTORE_*) —
# indispensable pour les mises à jour automatiques de l'app (même clé à chaque build).
name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DROIDCLEAN_KEYSTORE_B64: ${{ secrets.DROIDCLEAN_KEYSTORE_B64 }}
      DROIDCLEAN_KEYSTORE_PASSWORD: ${{ secrets.DROIDCLEAN_KEYSTORE_PASSWORD }}
      DROIDCLEAN_KEY_PASSWORD: ${{ secrets.DROIDCLEAN_KEY_PASSWORD }}
      DROIDCLEAN_KEY_ALIAS: ${{ secrets.DROIDCLEAN_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (avec cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.1"

      # Sur un tag v1.2.3, la version de l'APK est 1.2.3 : plus besoin de penser
      # à éditer build.gradle.kts avant de taguer.
      - name: Déterminer la version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "GRADLE_VERSION_ARG=-PdroidcleanVersionName=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "GRADLE_VERSION_ARG=" >> "$GITHUB_ENV"
          fi

      # Lint attrape les chaînes manquantes, mais pas un `%1$s` devenu `%1$d`
      # dans une traduction : un plantage à l'exécution, dans cette langue seulement.
      - name: Vérifier les traductions
        run: python3 tools/check-strings.py

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest $GRADLE_VERSION_ARG

      # Les erreurs lint bloquent (API trop récente, permission manquante,
      # format de chaîne invalide) ; les avertissements restent informatifs.
      - name: Lint
        run: ./gradlew lintRelease $GRADLE_VERSION_ARG

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore

      - name: Build signed release APK
        run: ./gradlew assembleRelease $GRADLE_VERSION_ARG

      - name: Nommer l'APK
        run: |
          VER=$(./gradlew -q --console=plain $GRADLE_VERSION_ARG printVersionName | tail -1)
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "droidclean-v${VER}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: droidclean-apk
          path: droidclean-v*.apk
          if-no-files-found: error

      - name: Publish "latest" release (push on main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --cleanup-tag : sans ça, le tag "latest" resterait figé sur un ancien commit.
          gh release delete latest --yes --cleanup-tag --repo "${{ github.repository }}" 2>/dev/null || true
          for i in 1 2 3 4 5; do
            if gh release create latest "droidclean-v${APP_VERSION}.apk" \
              --title "Latest build" \
              --target "$GITHUB_SHA" \
              --notes "APK le plus récent — build automatique du push sur main (signé). Les mises à jour automatiques de l'app ne suivent que les releases versionnées (tags v*)." \
              --repo "${{ github.repository }}"; then
              break
            fi
            echo "Échec création release (tentative $i/5), nouvel essai dans 10 s…"
            sleep 10
          done

      - name: Publish versioned release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Les notes de release sont la section correspondante du CHANGELOG :
          # c'est exactement ce que l'app affichera avant de proposer la mise à jour.
          NOTES_FILE=$(mktemp)
          python3 tools/changelog-section.py "$GITHUB_REF_NAME" > "$NOTES_FILE" || true
          if [ ! -s "$NOTES_FILE" ]; then
            echo "Build automatique — APK $GITHUB_REF_NAME (signé, mise à jour automatique)." > "$NOTES_FILE"
          fi
          gh release create "$GITHUB_REF_NAME" "droidclean-v${APP_VERSION}.apk" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$NOTES_FILE" \
            --repo "${{ github.repository }}" \
            || gh release upload "$GITHUB_REF_NAME" "droidclean-v${APP_VERSION}.apk" \
               --clobber --repo "${{ github.repository }}"
